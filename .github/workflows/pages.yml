name: Publicar vitrine no GitHub Pages

# Publica o conteúdo de vitrine/ sempre que ele muda na main.
# Antes do primeiro deploy alguém com acesso de administrador precisa ir em
# Settings > Pages e escolher "GitHub Actions" como origem.

on:
  push:
    branches: [main]
    paths:
      - 'vitrine/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já começou.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: vitrine

      - id: deploy
        uses: actions/deploy-pages@v4
