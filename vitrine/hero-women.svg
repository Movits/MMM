<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Três mulheres executivas elegantes de terno diante de uma metrópole">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.55" stop-color="#0b1526"/>
      <stop offset="0.85" stop-color="#122036"/>
      <stop offset="1" stop-color="#16263e"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#f5a623" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182741"/>
      <stop offset="1" stop-color="#101b2e"/>
    </linearGradient>
    <linearGradient id="towerMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22385c"/>
      <stop offset="1" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#060b14"/>
    </linearGradient>
    <pattern id="win" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect width="26" height="34" fill="none"/>
      <rect x="6" y="8" width="9" height="12" rx="1" fill="#f5c96a" opacity="0.55"/>
    </pattern>
    <pattern id="winSparse" width="34" height="46" patternUnits="userSpaceOnUse">
      <rect width="34" height="46" fill="none"/>
      <rect x="9" y="12" width="8" height="11" rx="1" fill="#ffd166" opacity="0.35"/>
    </pattern>
    <linearGradient id="suitA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2c49"/>
      <stop offset="1" stop-color="#10192c"/>
    </linearGradient>
    <linearGradient id="suitB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25314e"/>
      <stop offset="1" stop-color="#131c30"/>
    </linearGradient>
    <linearGradient id="suitC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182238"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- céu -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1150" cy="270" r="420" fill="url(#moonGlow)"/>
  <circle cx="1150" cy="270" r="74" fill="#f7d488" opacity="0.9"/>
  <circle cx="1150" cy="270" r="74" fill="none" stroke="#ffd166" stroke-opacity="0.35" stroke-width="2"/>

  <!-- estrelas -->
  <g fill="#ffffff">
    <circle cx="140" cy="120" r="1.6" opacity="0.5"/><circle cx="320" cy="80" r="1.2" opacity="0.35"/>
    <circle cx="520" cy="150" r="1.4" opacity="0.4"/><circle cx="700" cy="70" r="1.1" opacity="0.3"/>
    <circle cx="905" cy="130" r="1.5" opacity="0.45"/><circle cx="1380" cy="90" r="1.3" opacity="0.4"/>
    <circle cx="1490" cy="200" r="1.6" opacity="0.5"/><circle cx="240" cy="230" r="1.2" opacity="0.3"/>
    <circle cx="1270" cy="60" r="1.2" opacity="0.35"/><circle cx="60" cy="300" r="1.4" opacity="0.35"/>
  </g>

  <!-- skyline distante -->
  <g fill="url(#towerFar)" opacity="0.75">
    <rect x="-20" y="430" width="130" height="370"/>
    <rect x="120" y="360" width="95" height="440"/>
    <rect x="225" y="470" width="120" height="330"/>
    <rect x="355" y="330" width="85" height="470"/>
    <rect x="450" y="420" width="110" height="380"/>
    <rect x="570" y="300" width="95" height="500"/>
    <rect x="675" y="450" width="105" height="350"/>
    <rect x="790" y="380" width="90" height="420"/>
    <rect x="890" y="480" width="120" height="320"/>
    <rect x="1020" y="350" width="90" height="450"/>
    <rect x="1120" y="430" width="110" height="370"/>
    <rect x="1240" y="310" width="95" height="490"/>
    <rect x="1345" y="410" width="115" height="390"/>
    <rect x="1470" y="350" width="150" height="450"/>
  </g>

  <!-- skyline média com janelas acesas -->
  <g>
    <g>
      <rect x="40" y="300" width="150" height="500" fill="url(#towerMid)"/>
      <rect x="40" y="300" width="150" height="500" fill="url(#win)"/>
      <rect x="40" y="292" width="150" height="8" fill="#2c4467"/>
    </g>
    <g>
      <rect x="260" y="220" width="120" height="580" fill="url(#towerMid)"/>
      <rect x="260" y="220" width="120" height="580" fill="url(#winSparse)"/>
      <polygon points="260,220 320,170 380,220" fill="#22385c"/>
    </g>
    <g>
      <rect x="470" y="260" width="140" height="540" fill="url(#towerMid)"/>
      <rect x="470" y="260" width="140" height="540" fill="url(#win)"/>
      <rect x="524" y="200" width="10" height="60" fill="#2c4467"/>
    </g>
    <g>
      <rect x="700" y="180" width="130" height="620" fill="url(#towerMid)"/>
      <rect x="700" y="180" width="130" height="620" fill="url(#winSparse)"/>
      <rect x="758" y="120" width="8" height="60" fill="#2c4467"/>
    </g>
    <g>
      <rect x="930" y="320" width="150" height="480" fill="url(#towerMid)"/>
      <rect x="930" y="320" width="150" height="480" fill="url(#win)"/>
    </g>
    <g>
      <rect x="1180" y="240" width="130" height="560" fill="url(#towerMid)"/>
      <rect x="1180" y="240" width="130" height="560" fill="url(#winSparse)"/>
      <polygon points="1180,240 1245,196 1310,240" fill="#22385c"/>
    </g>
    <g>
      <rect x="1390" y="300" width="160" height="500" fill="url(#towerMid)"/>
      <rect x="1390" y="300" width="160" height="500" fill="url(#win)"/>
    </g>
  </g>

  <!-- névoa de profundidade -->
  <rect x="0" y="560" width="1600" height="260" fill="#0b1526" opacity="0.55"/>

  <!-- chão -->
  <rect x="0" y="790" width="1600" height="210" fill="url(#ground)"/>
  <rect x="0" y="788" width="1600" height="3" fill="#f5a623" opacity="0.14"/>

  <!-- sombras -->
  <ellipse cx="560" cy="905" rx="120" ry="16" fill="#000000" opacity="0.4"/>
  <ellipse cx="800" cy="915" rx="130" ry="17" fill="#000000" opacity="0.45"/>
  <ellipse cx="1045" cy="905" rx="120" ry="16" fill="#000000" opacity="0.4"/>

  <!-- ══ MULHER 1 — esquerda, mão no bolso, cabelo coque ══ -->
  <g>
    <ellipse cx="560" cy="384" rx="17" ry="15" fill="#3a2a1e"/>
    <circle cx="560" cy="368" r="9" fill="#3a2a1e"/>
    <circle cx="560" cy="392" r="26" fill="#c98f6b"/>
    <path d="M534 388 q0 -30 26 -30 q26 0 26 30 l0 -8 q-2 -26 -26 -26 q-24 0 -26 26 z" fill="#3a2a1e"/>
    <rect x="551" y="412" width="18" height="18" rx="7" fill="#b57d5c"/>
    <!-- blazer -->
    <path d="M560 424 q-52 6 -58 58 l-8 148 q0 10 10 10 l112 0 q10 0 10 -10 l-8 -148 q-6 -52 -58 -58 z" fill="url(#suitA)"/>
    <!-- camisa -->
    <path d="M560 428 l-16 12 16 52 16 -52 z" fill="#e9edf5"/>
    <!-- lapelas -->
    <path d="M560 428 l-20 14 10 34 10 -30 z" fill="#26385c"/>
    <path d="M560 428 l20 14 -10 34 -10 -30 z" fill="#1d2c49"/>
    <!-- braço esq no bolso -->
    <path d="M508 470 q-14 40 -4 86 q4 14 18 12 l6 -4 q-10 -44 -2 -86 z" fill="url(#suitA)"/>
    <!-- braço dir solto -->
    <path d="M612 470 q16 44 8 96 q-2 12 -14 12 q-10 0 -10 -12 q6 -50 -2 -90 z" fill="url(#suitA)"/>
    <circle cx="604" cy="586" r="8" fill="#c98f6b"/>
    <!-- rim light -->
    <path d="M614 448 q22 18 24 62 l6 116" stroke="url(#rim)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- calça -->
    <path d="M534 640 l8 216 q0 8 9 8 l12 0 q8 0 8 -8 l-4 -216 z" fill="#131c30"/>
    <path d="M586 640 l-8 216 q0 8 -9 8 l-12 0 q-8 0 -8 -8 l4 -216 z" fill="#0f1728"/>
    <path d="M540 864 l32 0 0 14 q0 8 -9 8 l-36 -4 q-6 -2 -2 -10 z" fill="#0a0f1c"/>
    <path d="M580 864 l-30 0 0 14 q0 8 9 8 l34 -4 q6 -2 2 -10 z" fill="#0a0f1c"/>
  </g>

  <!-- ══ MULHER 2 — centro, braços cruzados, cabelo longo ══ -->
  <g>
    <circle cx="800" cy="376" r="28" fill="#8d5b3f"/>
    <path d="M770 372 q0 -32 30 -32 q30 0 30 32 l4 58 q0 14 -12 12 l-4 -44 q-1 -22 -18 -22 q-17 0 -18 22 l-4 44 q-12 2 -12 -12 z" fill="#1d1712"/>
    <rect x="790" y="398" width="20" height="20" rx="8" fill="#7c4e35"/>
    <!-- blazer -->
    <path d="M800 412 q-58 6 -64 62 l-8 158 q0 10 10 10 l124 0 q10 0 10 -10 l-8 -158 q-6 -56 -64 -62 z" fill="url(#suitB)"/>
    <!-- camisa -->
    <path d="M800 416 l-17 13 17 46 17 -46 z" fill="#f2ead9"/>
    <path d="M800 416 l-22 15 11 32 11 -28 z" fill="#2e3d5e"/>
    <path d="M800 416 l22 15 -11 32 -11 -28 z" fill="#22304d"/>
    <!-- braços cruzados -->
    <path d="M744 468 q-8 44 6 64 q40 18 60 8 l-4 -26 q-30 4 -42 -12 q-10 -14 -6 -34 z" fill="url(#suitB)"/>
    <path d="M856 468 q8 44 -6 64 q-40 18 -60 8 l4 -26 q30 4 42 -12 q10 -14 6 -34 z" fill="#1a2540"/>
    <circle cx="768" cy="534" r="8" fill="#8d5b3f"/>
    <circle cx="832" cy="534" r="8" fill="#8d5b3f"/>
    <!-- rim light -->
    <path d="M854 438 q26 20 28 68 l6 122" stroke="url(#rim)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <!-- saia lápis + pernas -->
    <path d="M742 636 l116 0 6 92 q0 10 -10 10 l-108 0 q-10 0 -10 -10 z" fill="#141d33"/>
    <rect x="770" y="736" width="20" height="128" rx="9" fill="#8d5b3f"/>
    <rect x="810" y="736" width="20" height="128" rx="9" fill="#7c4e35"/>
    <path d="M766 862 l30 0 2 14 q0 8 -9 8 l-30 -4 q-6 -4 -2 -10 z" fill="#0a0f1c"/>
    <path d="M806 862 l30 0 2 14 q0 8 -9 8 l-30 -4 q-6 -4 -2 -10 z" fill="#0a0f1c"/>
  </g>

  <!-- ══ MULHER 3 — direita, segurando pasta, cabelo chanel ══ -->
  <g>
    <circle cx="1045" cy="390" r="26" fill="#e8b48d"/>
    <path d="M1016 392 q-4 -36 29 -36 q33 0 29 36 l-2 18 q-4 10 -12 8 l1 -18 q0 -22 -16 -22 q-16 0 -16 22 l1 18 q-8 2 -12 -8 z" fill="#4b3421"/>
    <rect x="1036" y="410" width="18" height="18" rx="7" fill="#d69c72"/>
    <!-- blazer -->
    <path d="M1045 422 q-52 6 -58 58 l-8 150 q0 10 10 10 l112 0 q10 0 10 -10 l-8 -150 q-6 -52 -58 -58 z" fill="url(#suitC)"/>
    <path d="M1045 426 l-15 12 15 48 15 -48 z" fill="#e9edf5"/>
    <path d="M1045 426 l-20 14 10 32 10 -28 z" fill="#1f2c47"/>
    <path d="M1045 426 l20 14 -10 32 -10 -28 z" fill="#16223a"/>
    <!-- braço esq dobrado com pasta -->
    <path d="M993 468 q-12 36 -2 66 q8 18 30 14 l22 -6 -6 -24 -20 4 q-10 0 -12 -12 q-4 -22 0 -38 z" fill="url(#suitC)"/>
    <rect x="1018" y="500" width="66" height="44" rx="5" fill="#c8a04f"/>
    <rect x="1018" y="500" width="66" height="8" rx="4" fill="#e2bc6b"/>
    <circle cx="1040" cy="530" r="7" fill="#e8b48d"/>
    <!-- braço dir solto -->
    <path d="M1097 468 q16 44 8 94 q-2 12 -13 12 q-10 0 -10 -12 q6 -48 -2 -88 z" fill="url(#suitC)"/>
    <circle cx="1090" cy="582" r="8" fill="#e8b48d"/>
    <!-- rim light -->
    <path d="M1099 446 q22 18 24 62 l6 114" stroke="url(#rim)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85"/>
    <!-- calça -->
    <path d="M1019 640 l8 214 q0 8 9 8 l12 0 q8 0 8 -8 l-4 -214 z" fill="#111a2d"/>
    <path d="M1071 640 l-8 214 q0 8 -9 8 l-12 0 q-8 0 -8 -8 l4 -214 z" fill="#0d1525"/>
    <path d="M1025 862 l32 0 0 14 q0 8 -9 8 l-36 -4 q-6 -2 -2 -10 z" fill="#0a0f1c"/>
    <path d="M1065 862 l-30 0 0 14 q0 8 9 8 l34 -4 q6 -2 2 -10 z" fill="#0a0f1c"/>
  </g>

  <!-- brilho dourado no chão -->
  <ellipse cx="800" cy="960" rx="560" ry="80" fill="url(#moonGlow)" opacity="0.35"/>
</svg>
